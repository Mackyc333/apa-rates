name: 毎朝の料金取得

on:
  schedule:
    - cron: "13 22 * * *"   # 毎日 日本時間 7:13 ごろ（GitHub 側の混雑で数十分遅れることがあります）
  workflow_dispatch:         # 「Run workflow」ボタンで手動実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 料金を取得してダッシュボードを作成
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_ORIGIN: ${{ secrets.RAKUTEN_ORIGIN }}
          APA_REPORT_PATH: site/index.html
        run: python3 apa_rates.py all

      - name: 取得データを保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "料金データ $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
